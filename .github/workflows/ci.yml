name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --exclude lakeprism-python --all-targets --features s3,delta-rs,iceberg-rest,unity,fixture-provider -- -D warnings
      - run: cargo test --locked --workspace --exclude lakeprism-python --all-targets --features s3,delta-rs,iceberg-rest,unity,fixture-provider
      - run: bash scripts/check-cold-warm-benchmark.sh

  native-runtime:
    # The host, Rust compiler target, FFmpeg development libraries, and Python
    # extension interpreter are all x86_64 Linux in this job. Do not replace
    # this with cross-compilation: native FFmpeg/PyO3 tests must link and run.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev libavdevice-dev libswresample-dev pkg-config
      - run: cargo test -p lakeprism-media --features native-media
      - run: cargo test -p lakeprism-datafusion --features native-media
      - run: cargo test -p lakeprism-flight --features native-media
      - run: cargo test -p lakeprism-cli
      - run: cargo check --locked --workspace --all-features
      - run: cargo clippy --locked -p lakeprism-python --all-features -- -D warnings
      - name: Test Python bindings in an isolated environment
        run: |
          python -m venv .native-venv
          .native-venv/bin/python -m pip install maturin==1.10.2 pytest pyarrow
          VIRTUAL_ENV="$PWD/.native-venv" .native-venv/bin/maturin develop --locked --manifest-path crates/lakeprism-python/Cargo.toml --all-features
          LAKEPRISM_NATIVE_MEDIA=1 .native-venv/bin/python -m pytest crates/lakeprism-python/python/lakeprism/test_bindings.py
