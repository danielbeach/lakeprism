[workspace]
members = [
    "crates/lakeprism-core",
    "crates/lakeprism-arrow",
    "crates/lakeprism-storage",
    "crates/lakeprism-media",
    "crates/lakeprism-documents",
    "crates/lakeprism-catalog",
    "crates/lakeprism-datafusion",
    "crates/lakeprism-delta",
    "crates/lakeprism-iceberg",
    "crates/lakeprism-unity",
    "crates/lakeprism-index",
    "crates/lakeprism-whisper",
    "crates/lakeprism-embedding",
    "crates/lakeprism-derived",
    "crates/lakeprism-flight",
    "crates/lakeprism-execution",
    "crates/lakeprism-cli",
    "crates/lakeprism-python",
]
default-members = [
    "crates/lakeprism-core",
    "crates/lakeprism-arrow",
    "crates/lakeprism-storage",
    "crates/lakeprism-media",
    "crates/lakeprism-documents",
    "crates/lakeprism-catalog",
    "crates/lakeprism-datafusion",
    "crates/lakeprism-delta",
    "crates/lakeprism-iceberg",
    "crates/lakeprism-unity",
    "crates/lakeprism-index",
    "crates/lakeprism-derived",
    "crates/lakeprism-flight",
    "crates/lakeprism-execution",
    "crates/lakeprism-cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
arrow = { version = "59.3.0", features = ["ffi"] }
arrow-flight = { version = "59.0.0", features = ["flight-sql"] }
async-trait = "0.1.92"
datafusion = "55.1.0"
deltalake = { version = "1.1.0", default-features = false, features = ["datafusion", "rustls"] }
object_store = { version = "0.13.2", default-features = false, features = ["aws"] }
iceberg = { package = "iceberg-arrow59", version = "0.9.12" }
iceberg-datafusion = { package = "iceberg-datafusion-arrow59", version = "0.9.9" }
iceberg-catalog-rest = { package = "iceberg-catalog-rest-arrow59", version = "0.9.7" }
futures = "0.3.31"
fs2 = "0.4.3"
prost = "0.14.1"
ffmpeg-next = "9.0.0"
lopdf = "0.45.0"
pyo3 = { version = "0.29.3", features = ["abi3-py39", "extension-module"] }
parquet = "59.3.0"
quick-xml = "0.42.0"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "io-util", "sync", "macros", "net", "rt-multi-thread", "time"] }
tokio-stream = { version = "0.1.17", features = ["net"] }
tokio-util = "0.7.17"
tonic = { version = "0.14.1", features = ["transport"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
base64 = "0.22.1"
zip = "7.2.0"
