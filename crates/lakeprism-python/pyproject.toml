[build-system]
requires = ["maturin==1.10.2"]
build-backend = "maturin"

[project]
name = "lakeprism"
version = "0.1.0"
description = "Notebook-friendly bindings for governed local LakePrism queries"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "LakePrism contributors" }]
keywords = ["arrow", "datafusion", "delta-lake", "lakehouse", "notebook"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/danielbeach/lakeprism"
Documentation = "https://github.com/danielbeach/lakeprism#start-with-python"
Source = "https://github.com/danielbeach/lakeprism"

[project.optional-dependencies]
notebook = [
  "ipython>=8",
  "pandas>=1.5",
  "pyarrow>=14",
  "tqdm>=4.64",
]
test = ["pytest>=7"]

[tool.maturin]
module-name = "lakeprism._lakeprism"
python-source = "python"
