[package]
name = "lakeprism-iceberg"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
iceberg-rust = ["dep:iceberg", "dep:iceberg-datafusion"]
iceberg-rest = [
    "iceberg-rust",
    "dep:async-trait",
    "dep:iceberg-catalog-rest",
    "dep:reqwest",
]

[dependencies]
async-trait = { workspace = true, optional = true }
datafusion.workspace = true
iceberg = { workspace = true, optional = true }
iceberg-datafusion = { workspace = true, optional = true }
iceberg-catalog-rest = { workspace = true, optional = true }
lakeprism-datafusion = { path = "../lakeprism-datafusion" }
lakeprism-core = { path = "../lakeprism-core" }
reqwest = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio.workspace = true
wiremock = "0.6.5"
